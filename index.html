<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>스마트 시험 감독 배정</title>
  <meta name="description" content="시험 감독 배정 프로그램 — 규칙을 지키며 시수를 고르게 배정하고 엑셀로 내보냅니다.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233b4fd8'/><path d='M8 10h16M8 16h16M8 22h10' stroke='white' stroke-width='3' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div class="brand-text"><b>스마트 시험 감독 배정</b><small id="brandSub">by 이용휘</small></div>
    </div>
    <span class="save-state" id="saveState"></span>
    <span class="spacer"></span>
    <button class="btn ghost" data-act="help" title="자세한 사용 설명서">설명서</button>
    <button class="btn ghost" data-act="backup-load" title="백업 파일(.json)을 불러와 그대로 복원">백업 불러오기</button>
    <button class="btn" data-act="backup-save" title="입력한 자료 전체를 파일 하나로 내 컴퓨터에 저장">백업 저장<span id="backupDot"></span></button>
  </header>

  <nav class="stepper" id="steps" aria-label="진행 단계"></nav>

  <main>
    <section class="tab" id="tab-setup"></section>
    <section class="tab" id="tab-subjects"></section>
    <section class="tab" id="tab-teachers"></section>
    <section class="tab" id="tab-extras"></section>
    <section class="tab" id="tab-result"></section>
  </main>

  <footer>ⓒ 2026. Designed &amp; Coded by 이용휘. All rights reserved.</footer>

  <datalist id="teacherNames"></datalist>
  <input type="file" id="fileInput" hidden>

  <!-- 접속 암호 화면: 암호가 맞아야 아래 앱이 나타남 (js/config.js 의 url 이 비어 있으면 건너뜀) -->
  <div id="gate" class="gate" hidden>
    <form class="gate-box" id="gateForm" autocomplete="off">
      <div class="gate-brand"><span class="brand-mark" aria-hidden="true"></span><b>스마트 시험 감독 배정</b></div>
      <label class="gate-label" for="gatePw">접속 암호</label>
      <input type="password" id="gatePw" class="gate-input" placeholder="학교에서 안내받은 접속 암호" autofocus>
      <p class="gate-msg" id="gateMsg"></p>
      <button type="submit" class="btn primary gate-btn" id="gateBtn">들어가기</button>
      <p class="gate-foot"><button type="button" class="linklike" data-act="gate-change">접속 암호 바꾸기 (관리자)</button></p>
    </form>
  </div>

  <script src="vendor/exceljs.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
