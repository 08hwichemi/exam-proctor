<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>스마트 시험 감독 배정</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>📊 스마트 시험 감독 배정 <small>by 이용휘</small></h1>
    <span class="save-state" id="saveState"></span>
    <span class="spacer"></span>
    <button class="btn" data-act="help">❓ 설명서</button>
    <button class="btn" data-act="backup-save" title="입력한 자료 전체를 파일 하나로 내 컴퓨터에 저장">💾 백업 파일 저장<span id="backupDot"></span></button>
    <button class="btn" data-act="backup-load" title="백업 파일(.json)을 불러와 그대로 복원">📂 백업 불러오기</button>
    <button class="btn primary" data-act="goto-run">🚀 배정하러 가기</button>
  </header>

  <nav class="steps" id="steps">
    <button class="step" data-tab="setup">1. 기본 설정</button>
    <button class="step" data-tab="subjects">2. 시험 과목</button>
    <button class="step" data-tab="teachers">3. 교사 명단</button>
    <button class="step" data-tab="extras">4. 특수실·예외</button>
    <button class="step" data-tab="result">5. 배정 결과</button>
  </nav>

  <main>
    <section class="tab" id="tab-setup"></section>
    <section class="tab" id="tab-subjects"></section>
    <section class="tab" id="tab-teachers"></section>
    <section class="tab" id="tab-extras"></section>
    <section class="tab" id="tab-result"></section>
  </main>

  <footer>ⓒ 2026. Designed &amp; Coded by 이용휘. All rights reserved.</footer>

  <datalist id="teacherNames"></datalist>
  <input type="file" id="fileInput" hidden>

  <script src="vendor/exceljs.min.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
